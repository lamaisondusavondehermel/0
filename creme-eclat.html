<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Produit - La Maison du Savon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        .product-info-container {
            max-width: 600px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .product-info-container img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .back-home {
            display: inline-block;
            margin: 20px;
            text-decoration: none;
            color: var(--dark-brown);
            font-weight: bold;
        }
    </style>
</head>
<body>

<a href="index.html" class="back-home">← Retour à la Collection</a>

<main>
    <section>
        <h1>Eclat</h1> 
        <span class="price" style="font-size: 1.5em;">$5.00</span> 
        
        <div class="product-info-container">
            <img src="Crème Visage.png" alt="Photo 1">
            <img src="Crème Visage (1).png" alt="Photo 2">
            
        </div>

        <a href="https://wa.me/96170514786?text=Bonjour,%20je%20voudrais%20commander%20le%20Savon%20à%20l'Huile%20d'Olive%20et%20au%20Beurre%20de%20Karité" target="_blank" style="text-decoration: none;">
            <button style="background: var(--light-brown); color: white; border: none; padding: 15px 30px; border-radius: 25px; cursor: pointer; font-size: 1.1em; margin-top: 20px;">
                Commander sur WhatsApp
            </button>
        </a>
    </section>
</main>

<footer>
    <p>© La Maison du Savon de Hermel</p>
</footer>

</html>
